
<section id="how-it-works" class="py-24 bg-white">

  <div class="max-w-4xl mx-auto px-4 sm:px-6">

    <!-- Section Heading -->
    <div class="text-center mb-16">

      <!-- Badge -->
      <div
        class="mb-6 inline-flex items-center gap-1.5 bg-red-500/10 border border-red-500/15 text-red-500 text-[11px] font-medium tracking-[0.06em] uppercase px-3.5 py-1.5 rounded-full">

        <svg [lucideIcon]="badgeIcon" class="size-3"></svg>

        Simple setup

      </div>

      <!-- Heading -->
      <h2 class="font-serif font-medium text-4xl sm:text-5xl leading-tight text-gray-900">

        Up and running in
        <span class="text-red-400 italic">minutes</span>

      </h2>

      <!-- Description -->
      <p class="mt-5 text-gray-500 max-w-lg mx-auto leading-relaxed">

        No complicated onboarding, no steep learning curve.
        Just connect, create, and grow.

      </p>

    </div>

    <!-- Steps -->
    <div class="space-y-6">

      @for (s of steps; track s.step; let i = $index) {

        <div class="flex gap-6 items-start">

          <!-- Step Number -->
          <div
            class="shrink-0 size-12 rounded-2xl bg-red-50 border border-red-100 flex items-center justify-center">

            <span class="text-sm font-medium text-red-500">
              {{ s.step }}
            </span>

          </div>

          <!-- Step Details -->
          <div class="pt-1">

            <h3 class="text-slate-900 mb-1">
              {{ s.title }}
            </h3>

            <p class="text-slate-500 text-sm leading-relaxed">
              {{ s.description }}
            </p>

          </div>

          <!-- Arrow: show except after the last step -->
          @if (i < steps.length - 1) {

            <div class="hidden sm:block ml-auto shrink-0 self-center">

              <svg
                [lucideIcon]="arrowIcon"
                class="size-4 text-slate-200">
              </svg>

            </div>

          }

        </div>

      }

    </div>

  </div>

</section>
