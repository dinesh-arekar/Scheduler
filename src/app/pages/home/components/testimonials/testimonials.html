
<section class="py-24 bg-slate-50">

  <div class="max-w-6xl mx-auto px-4 sm:px-6">

    <!-- Section Heading -->
    <div class="text-center mb-14">

      <!-- Badge -->
      <div
        class="mb-6 inline-flex items-center gap-1.5 bg-red-500/10 border border-red-500/15 text-red-500 text-[11px] font-medium tracking-[0.06em] uppercase px-3.5 py-1.5 rounded-full">

        <svg lucideStar class="size-3"></svg>

        Testimonials

      </div>

      <!-- Heading -->
      <h2
        class="font-serif font-medium text-4xl sm:text-5xl leading-tight text-gray-900">

        Loved by
        <span class="text-red-400">creators &amp; teams</span>

      </h2>

      <!-- Description -->
      <p class="mt-5 text-gray-500 max-w-md mx-auto">

        Join thousands of people who automate their social media with Scheduler.

      </p>

    </div>

    <!-- Testimonial Cards -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-5">

      @for (t of testimonials; track t.name) {

        <div
          class="bg-white rounded-2xl border border-slate-100 hover:border-slate-200 hover:shadow-lg hover:shadow-slate-100 p-6 transition-all flex flex-col gap-4">

          <!-- Review -->
          <p class="text-slate-600 text-sm leading-relaxed flex-1">
            "{{ t.text }}"
          </p>

          <!-- User Details -->
          <div class="flex items-center gap-3 pt-2 border-t border-slate-100">

            <!-- Avatar -->
            <div
              [class]="'size-9 rounded-full bg-linear-to-br ' + t.avatarBg + ' flex items-center justify-center text-white text-sm font-bold shrink-0'">

              {{ t.avatar }}

            </div>

            <!-- Name and Role -->
            <div>

              <div class="text-sm font-medium text-slate-900">
                {{ t.name }}
              </div>

              <div class="text-xs text-slate-400">
                {{ t.role }}
              </div>

            </div>

          </div>

        </div>

      }

    </div>

  </div>

</section>
