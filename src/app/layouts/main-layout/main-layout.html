<div class="flex h-screen bg-slate-50">

  <!-- Mobile Overlay -->
  @if (isMobileMenuOpen) {
    <div
      class="fixed inset-0 z-40 bg-slate-900/50 md:hidden"
      (click)="closeMobileMenu()">
    </div>
  }

  <!-- Sidebar -->
  <app-sidebar
  [isOpen]="isMobileMenuOpen"
  (closeMenu)="closeMobileMenu()">
</app-sidebar>

  <!-- Main Content -->
  <div class="flex flex-1 flex-col overflow-hidden">

    <!-- Top Bar -->
    <header
      class="flex h-16 shrink-0 items-center gap-4 border-b border-slate-200 bg-white px-4 md:px-8">

      <!-- Mobile Menu Button -->
      <button
        type="button"
        class="-ml-2 p-2 text-slate-500 md:hidden"
        aria-label="Open navigation menu"
        (click)="openMobileMenu()">

        <svg
          lucideMenu
          class="size-6">
        </svg>

      </button>

      <!-- Dynamic Page Title -->
      <div>
        <h1 class="text-slate-900">
          {{ title }}
        </h1>

        <p class="hidden text-sm text-slate-400 sm:block">
          Manage and automate your social presence
        </p>
      </div>

    </header>

    <!-- Current Page -->
    <main
      class="flex-1 overflow-auto p-4 sm:p-6 md:p-8 xl:p-12">

      <router-outlet></router-outlet>

    </main>

  </div>

</div>
